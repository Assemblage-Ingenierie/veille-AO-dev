<!DOCTYPE html>
<html lang="fr" data-auth="public">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Veille AO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="/static/auth.js"></script>
<style>
:root{
  --ai-rouge:#E30513; --ai-violet:#30323E; --ai-gris:#DFE4E8;
  --ai-rouge-clair:#F9E1E3; --ai-gris-clair:#F2F2F2; --ai-noir70:#4D4D4D;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Open Sans',-apple-system,sans-serif;background:var(--ai-gris-clair);color:#000;
  font-size:14px;line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:400px;background:#fff;border:1px solid var(--ai-gris);border-radius:6px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);overflow:hidden}
.card-head{padding:1.4rem 1.6rem 1rem;border-bottom:1px solid var(--ai-gris)}
.card-head img{width:150px;height:auto;display:block;margin-bottom:.8rem}
.card-head h1{font-size:1.15rem;color:var(--ai-violet)}
.card-head p{font-size:.8rem;color:var(--ai-noir70);margin-top:.15rem}
.card-body{padding:1.3rem 1.6rem 1.5rem}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:.55rem;padding:.6rem 1rem;
  border-radius:4px;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .12s}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-google{background:#fff;color:#1f1f1f;border:1px solid #CDD2D6}
.btn-google:hover:not(:disabled){border-color:var(--ai-violet);background:#fafafa}
.btn-primary{background:var(--ai-rouge);color:#fff;border:none}
.btn-primary:hover:not(:disabled){background:#c00411}
.btn-outline{background:transparent;color:var(--ai-violet);border:1px solid var(--ai-gris)}
.btn-outline:hover{border-color:var(--ai-violet)}
.sep{display:flex;align-items:center;gap:.6rem;margin:1rem 0;color:var(--ai-noir70);font-size:.75rem}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--ai-gris)}
label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ai-noir70);margin-bottom:.3rem}
input[type=email]{width:100%;padding:.5rem .65rem;border:1px solid var(--ai-gris);border-radius:4px;
  font-family:inherit;font-size:.9rem;margin-bottom:.6rem}
input[type=email]:focus{outline:none;border-color:var(--ai-violet)}
.hint{font-size:.74rem;color:var(--ai-noir70);margin-top:.9rem;text-align:center}
.msg{margin-top:.9rem;padding:.6rem .75rem;border-radius:4px;font-size:.8rem;display:none}
.msg.ok{display:block;background:#ecfdf3;color:#166534;border-left:3px solid #16a34a}
.msg.err{display:block;background:var(--ai-rouge-clair);color:#8a0a12;border-left:3px solid var(--ai-rouge)}
.state h2{font-size:1rem;color:var(--ai-violet);margin-bottom:.4rem}
.state p{font-size:.84rem;color:var(--ai-noir70);margin-bottom:.9rem}
.state .who{font-weight:600;color:#000}
.state .actions{display:flex;flex-direction:column;gap:.5rem}
.hidden{display:none}
.spinner{width:20px;height:20px;border:2px solid var(--ai-gris);border-top-color:var(--ai-rouge);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="card">
  <div class="card-head">
    <img src="/static/logo_Ai_rouge_HD.png" alt="Assemblage ingénierie">
    <h1>Veille AO</h1>
    <p>Plateforme de veille des appels d'offres</p>
  </div>
  <div class="card-body">

    <div id="view-loading"><div class="spinner" aria-label="Chargement"></div></div>

    <div id="view-signin" class="hidden">
      <button class="btn btn-google" id="btn-google" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continuer avec Google
      </button>
      <div class="sep">ou</div>
      <form id="form-email">
        <label for="email">Adresse email</label>
        <input type="email" id="email" required placeholder="prenom.nom@assemblage.net" autocomplete="email">
        <button class="btn btn-primary" id="btn-email" type="submit">Recevoir un lien de connexion</button>
      </form>
      <p class="hint">Réservé aux comptes <b>@assemblage.net</b>. Le premier accès doit être validé par un administrateur.</p>
    </div>

    <div id="view-state" class="state hidden">
      <h2 id="state-title"></h2>
      <p id="state-text"></p>
      <div class="actions">
        <button class="btn btn-outline" id="btn-recheck" type="button">Vérifier à nouveau</button>
        <button class="btn btn-outline" id="btn-signout" type="button">Se déconnecter</button>
      </div>
    </div>

    <div class="msg" id="msg" role="status"></div>
  </div>
</main>

<script>
'use strict';

const $ = (id) => document.getElementById(id);

function nextPath(){
  const n = new URLSearchParams(location.search).get('next') || '/';
  // Uniquement un chemin interne (pas de redirection vers un autre site).
  return (n.startsWith('/') && !n.startsWith('//') && !n.startsWith('/login')) ? n : '/';
}

function redirectUrl(){
  return location.origin + '/login?next=' + encodeURIComponent(nextPath());
}

function show(view){
  for(const v of ['loading','signin','state']) $('view-' + v).classList.toggle('hidden', v !== view);
}

function message(text, kind){
  const el = $('msg');
  el.textContent = text || '';
  el.className = 'msg' + (text ? ' ' + kind : '');
}

// Erreur renvoyée par Supabase dans l'URL (ex. inscription hors @assemblage.net).
function urlError(){
  const params = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  return params.get('error_description') || hash.get('error_description') || '';
}

function showState(me){
  const titles = {
    pending:  'Demande d\'accès envoyée',
    rejected: 'Accès refusé',
    revoked:  'Accès révoqué',
  };
  const texts = {
    pending:  'Un administrateur a été prévenu et doit valider votre accès. Revenez un peu plus tard, puis cliquez sur « Vérifier à nouveau ».',
    rejected: 'Votre demande d\'accès a été refusée. Contactez un administrateur si vous pensez qu\'il s\'agit d\'une erreur.',
    revoked:  'Votre accès à Veille AO a été retiré. Contactez un administrateur si nécessaire.',
  };
  $('state-title').textContent = titles[me.status] || 'Accès non autorisé';
  $('state-text').textContent = '';
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = me.email;
  $('state-text').append('Compte : ', who, '. ', texts[me.status] || '');
  $('btn-recheck').classList.toggle('hidden', me.status !== 'pending');
  show('state');
}

async function check(){
  show('loading');
  message('');
  try{
    const client = await VeilleAuth.getClient();
    const { data } = await client.auth.getSession();
    if(!data.session){
      show('signin');
      const err = urlError();
      if(err) message(err, 'err');
      return;
    }
    const r = await fetch('/api/me');
    if(r.status === 401){
      await client.auth.signOut();
      show('signin');
      message('Session expirée : veuillez vous reconnecter.', 'err');
      return;
    }
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const me = await r.json();
    if(me.status === 'approved'){ location.replace(nextPath()); return; }
    showState(me);
  }catch(e){
    console.error(e);
    show('signin');
    message('Service momentanément indisponible. Réessayez dans un instant.', 'err');
  }
}

$('btn-google').addEventListener('click', async () => {
  $('btn-google').disabled = true;
  try{
    const client = await VeilleAuth.getClient();
    const { error } = await client.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: redirectUrl() },
    });
    if(error) throw error;
  }catch(e){
    $('btn-google').disabled = false;
    message('Connexion Google impossible : ' + (e.message || e), 'err');
  }
});

$('form-email').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const email = $('email').value.trim();
  if(!email) return;
  $('btn-email').disabled = true;
  message('');
  try{
    const client = await VeilleAuth.getClient();
    const { error } = await client.auth.signInWithOtp({
      email, options: { emailRedirectTo: redirectUrl() },
    });
    if(error) throw error;
    message('Un lien de connexion a été envoyé à ' + email + '. Pensez à vérifier vos indésirables.', 'ok');
  }catch(e){
    message('Envoi impossible : ' + (e.message || e), 'err');
  }finally{
    $('btn-email').disabled = false;
  }
});

$('btn-recheck').addEventListener('click', check);
$('btn-signout').addEventListener('click', () => VeilleAuth.signOut());

check();
</script>
</body>
</html>
