<style>
/* ── Spécifique à la page Offres pertinentes ── */
.app-content > * { max-width: 1200px; }
.detail-text { font-size: var(--fs-md); line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto; }
.detail-block + .detail-block { margin-top: var(--sp-3); }
.docs-list { display: flex; flex-direction: column; gap: 4px; }
.doc-link { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ai-violet); text-decoration: none; word-break: break-all; }
.doc-link:hover { color: var(--ai-rouge); text-decoration: underline; }
.doc-link .icon { width: 14px; height: 14px; }
.detail-cache { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: var(--fs-xs); color: var(--ai-noir70);
  margin-top: var(--sp-3); padding-top: var(--sp-2); border-top: 1px dotted var(--ai-trait); font-variant-numeric: tabular-nums; }
.link-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--ai-rouge); cursor: pointer; text-decoration: underline; }
.state-msg { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--ai-noir70); }
.state-msg.error { color: var(--ai-rouge); }
.spinner-dark { width: 14px; height: 14px; border: 2px solid var(--ai-gris); border-top-color: var(--ai-violet);
  border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
.empty-page { text-align: center; padding: var(--sp-7) var(--sp-4); color: var(--ai-noir70); }
.empty-page a { color: var(--ai-rouge); font-weight: 600; }

/* Bandeau « nouvelles assignations » */
.assign-banner { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-bottom: var(--sp-4); }

/* Assignations (pied de fiche) */
.card-assign { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); background: var(--ai-gris-tres-clair); }
.card-assign .section-label { margin: 0 var(--sp-2) 0 0; display: inline-flex; align-items: center; gap: 4px; }
.card-assign .section-label .icon { width: 14px; height: 14px; }
.assign-chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; align-items: center; }
.kw-chip small { font-weight: 400; color: var(--ai-noir70); margin-left: 4px; }
.assign-form { display: flex; gap: var(--sp-2); }
.assign-select { height: 28px; padding: 0 8px; border: var(--line); border-radius: var(--radius); font: inherit;
  font-size: var(--fs-sm); color: var(--ai-violet); background: var(--ai-blanc); }
.assign-select:focus { outline: none; border-color: var(--ai-violet); box-shadow: var(--focus); }

@media (max-width: 768px) {
  .card-assign { flex-direction: column; align-items: stretch; }
  .assign-form { flex-direction: column; }
  .assign-select { height: 40px; }
}
</style>
</head>
<body>

<!-- Icônes SVG monochromes -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 21v-5h-5"/></symbol>

<div class="app">

<header class="app-header">
  <button class="hamburger" type="button" onclick="toggleSidebar()" aria-label="Ouvrir le menu">
    <svg class="icon" style="width:22px;height:22px"><use href="#i-menu"/></svg>
  </button>
  <img class="logo" src="/static/logo_Ai_rouge_HD.png" alt="Assemblage ingénierie">

  <div class="app-title">Veille AO<small>Plateforme de veille · AO DEV</small></div>
  <div class="app-header-actions">
    <a href="/pertinentes" class="header-notif" aria-label="Offres pertinentes qui me sont assignées">

<main class="app-content">
  <div class="page-head">
    <div>
      <h1>Offres pertinentes</h1>
      <p>Offres marquées « Pertinent » dans Analyse AO — à approfondir ou à transmettre</p>
    </div>
    <span class="counter"><b id="count-chip">—</b> offres</span>
  </div>

  <div class="note note-soft assign-banner" id="assign-banner" role="status" style="display:none">
    <span id="assign-banner-text"></span>
    <button class="btn btn-ghost btn-sm" type="button" aria-label="Fermer" onclick="document.getElementById('assign-banner').style.display='none'">
      <svg class="icon"><use href="#i-close"/></svg>
    </button>
  </div>

  <div id="cards-container">
    <div class="empty-page">Chargement…</div>
  </div>

<img src="/static/sigle_A_rouge_HD.png" alt="" class="ai-watermark" aria-hidden="true">
<script>
'use strict';

function toggleSidebar(){ document.body.classList.toggle('sidebar-open') }

// ── Triage ──────────────────────────────────────────────────────────────────
let triageMap = new Map();
async function loadTriage(){
  try{
    const r = await fetch('/api/triage');
    const d = await r.json();
    triageMap = new Map(Object.entries(d.triage || {}));
  }catch(e){ console.warn('Triage:', e); }
}

// ── Équipe & Assignations ────────────────────────────────────────────────────
// Les membres sont les comptes validés ; une assignation désigne un compte (id).
let teamMembers = [];      // [{id, name, email, role}]
let allAssignments = {};   // {notice_id: [{assignee, assignee_name, assigned_by_name, …}]}

async function loadTeam(){
  try{
    const r = await fetch('/api/team');
    const d = await r.json();
    teamMembers = d.members || [];
  }catch(e){ console.warn('Équipe :', e); }
}

async function loadAssignments(){
  try{
    const r = await fetch('/api/assignments');
    const d = await r.json();
    allAssignments = d.assignments || {};
  }catch(e){ console.warn('Assignations :', e); }
}

function memberName(id){
  const m = teamMembers.find(x => x.id === id);
  return m ? m.name : '';
}

// ── Utils ────────────────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtDate(s){ if(!s) return ''; try{ return new Date(s+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'2-digit'}); }catch{ return s; } }
function isUrgent(s){ if(!s) return false; const d=(new Date(s)-new Date())/(1000*86400); return d>=0&&d<=7; }
function bailleurShort(b){ return {'Banque Mondiale':'BM','Expertise France':'EF','TED':'UE'}[b] || b; }
function gauge(p){ const lvl = p==='Haute' ? 3 : (p==='Moyenne' ? 2 : 1); return `<span class="gauge" data-level="${lvl}"><i></i><i></i><i></i></span>`; }
const ICON = name => `<svg class="icon"><use href="#i-${name}"/></svg>`;

// ── Section assignation ───────────────────────────────────────────────────────
function renderAssignSection(noticeId){
  const assigned = allAssignments[noticeId] || [];
  const chips = assigned.map(a =>
    `<span class="kw-chip">${esc(a.assignee_name || memberName(a.assignee) || 'Ancien membre')}${a.assigned_by_name ? `<small>par ${esc(a.assigned_by_name)}</small>` : ''}<button type="button" onclick="removeAssign('${esc(noticeId)}','${esc(a.assignee)}')" aria-label="Retirer l'assignation" title="Retirer">×</button></span>`
  ).join('');
  const available = teamMembers.filter(m => !assigned.some(a => a.assignee === m.id));
  const opts = available.map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('');
  const form = opts ? `<div class="assign-form">
    <select class="assign-select" id="asel-${esc(noticeId)}" aria-label="Membre à qui assigner l'offre">
      <option value="">Assigner à…</option>${opts}
    </select>
    <button class="btn btn-secondary btn-sm" type="button" onclick="doAssign('${esc(noticeId)}')">Notifier</button></div>` : '';
  return `<div class="ao-card-foot card-assign" id="asec-${esc(noticeId)}">
    <span class="section-label">${ICON('user')}Assigné à</span>
    <div class="assign-chips">${chips || '<span class="muted" style="font-size:var(--fs-sm)">Personne pour l\'instant</span>'}</div>
    ${form}
  </div>`;
}

async function doAssign(noticeId){
  const sel = document.getElementById(`asel-${noticeId}`);
  if(!sel || !sel.value) return;
  const assignee = sel.value;
  try{
    const r = await fetch(`/api/assignments/${encodeURIComponent(noticeId)}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({assignee})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    if(!allAssignments[noticeId]) allAssignments[noticeId] = [];
    allAssignments[noticeId].push({
      assignee, assignee_name: memberName(assignee),
      assigned_by: VeilleAuth.user.id, assigned_by_name: VeilleAuth.user.name,
      assigned_at: new Date().toISOString(),
    });
    const sec = document.getElementById(`asec-${noticeId}`);
    if(sec) sec.outerHTML = renderAssignSection(noticeId);
  }catch(e){ alert('Assignation impossible : ' + e.message); }
}

async function removeAssign(noticeId, assignee){
  try{
    const r = await fetch(`/api/assignments/${encodeURIComponent(noticeId)}?assignee=${encodeURIComponent(assignee)}`,
                          {method:'DELETE'});
    if(!r.ok) throw new Error((await r.json()).error || ('HTTP ' + r.status));
    if(allAssignments[noticeId])
      allAssignments[noticeId] = allAssignments[noticeId].filter(a => a.assignee !== assignee);
    const sec = document.getElementById(`asec-${noticeId}`);
    if(sec) sec.outerHTML = renderAssignSection(noticeId);
  }catch(e){ alert('Retrait impossible : ' + e.message); }
}

// ── Rendu des cartes ──────────────────────────────────────────────────────────
function renderCard(n){
  const spec = [
    ['Pays', esc(n.pays)],
    ['Limite', n.date_limite ? `<span class="deadline${isUrgent(n.date_limite)?' urgent':''}">${fmtDate(n.date_limite)}</span>` : ''],
    ['Publication', n.date_publication ? fmtDate(n.date_publication) : ''],
    ['Type', esc(n.type_avis)],
    ['Mode', esc(n.mode_selection)],
    ['Langue', esc(n.langue)],
    ['Secteur', esc(n.secteur)],
    ['Pertinence', `${gauge(n.pertinence)} ${esc(n.pertinence||'À vérifier')}`],
  ].filter(([,v]) => v).map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  return `
<article class="ao-card triage-pertinent" id="card-${esc(n.id)}">
  <div class="ao-card-head">
    <span class="badge" title="${esc(n.bailleur)}">${esc(bailleurShort(n.bailleur))}</span>
    <div class="title">${esc(n.titre)}
      ${n.projet && n.projet!==n.titre ? `<small>${esc(n.projet)}</small>` : ''}</div>
    <div class="actions">
      ${n.lien ? `<a href="${esc(n.lien)}" target="_blank" rel="noopener" class="btn btn-outline btn-sm">${ICON('ext')}Voir l'avis</a>` : ''}
    </div>
  </div>
  <div class="ao-card-body">
    <aside class="spec"><dl>${spec}</dl></aside>
    <div class="ao-card-content" id="body-${esc(n.id)}">
      <div class="state-msg"><div class="spinner-dark"></div>Chargement…</div>
    </div>
  </div>
  ${renderAssignSection(n.id)}
</article>`;
}

// ── Chargement du détail ──────────────────────────────────────────────────────
async function fetchDetail(noticeId, force=false){
  const body = document.getElementById(`body-${noticeId}`);
  if(!body) return;
  if(force){
    body.innerHTML = `<div class="state-msg"><div class="spinner-dark"></div>Mise à jour…</div>`;
  }
  try{
    const url = `/api/ao-detail/${encodeURIComponent(noticeId)}${force?'?force=true':''}`;
    const r = await fetch(url);
    const d = await r.json();
    if(d.error){ body.innerHTML=`<div class="state-msg error">${esc(d.error)}</div>`; return; }

    // Cas : fetch précédemment échoué, mis en cache comme indisponible
    if(d._failed){
      body.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.className = 'state-msg error';
      wrap.appendChild(document.createTextNode('Source inaccessible · '));
      const btn = document.createElement('button');
      btn.className = 'link-btn';
      btn.type = 'button';
      btn.textContent = 'Réessayer';
      btn.addEventListener('click', () => fetchDetail(noticeId, true));
      wrap.appendChild(btn);
      if(d._fetched_at){
        const ts = document.createElement('span');
        ts.className = 'muted num';
        ts.textContent = ` (dernier essai : ${d._fetched_at.slice(0,16).replace('T',' ')})`;
        wrap.appendChild(ts);
      }
      body.appendChild(wrap);
      return;
    }

    const parts = [];
    const txt = d.description||d.description_section||d.full_text||'';
    if(txt) parts.push(`<div class="detail-block"><div class="section-label">Mission</div><div class="detail-text">${esc(txt)}</div></div>`);
    if(d.documents&&d.documents.length) parts.push(`<div class="detail-block"><div class="section-label">Documents</div><div class="docs-list">${
      d.documents.map(doc=>`<a href="${esc(doc.url)}" target="_blank" rel="noopener" class="doc-link">${ICON('doc')}${esc(doc.name)}</a>`).join('')
    }</div></div>`);
    if(d.note) parts.push(`<div class="detail-block note note-context">${esc(d.note)}</div>`);
    body.innerHTML = parts.length ? parts.join('') : `<div class="state-msg">Aucune donnée disponible.</div>`;

    // Badge cache
    if(d._cached){
      const ts = d._fetched_at ? d._fetched_at.slice(0,16).replace('T',' ') : '';
      const badge = document.createElement('div');
      badge.className = 'detail-cache';
      badge.textContent = `En cache${ts ? ' · ' + ts : ''}`;
      const sep = document.createTextNode(' · ');
      const btn = document.createElement('button');
      btn.className = 'link-btn';
      btn.type = 'button';
      btn.textContent = 'Actualiser';
      btn.addEventListener('click', () => fetchDetail(noticeId, true));
      badge.appendChild(sep);
      badge.appendChild(btn);
      body.appendChild(badge);
    }
  }catch(e){ if(body) body.innerHTML=`<div class="state-msg error">${esc(String(e))}</div>`; }
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init(){
  await Promise.all([loadTriage(), loadTeam(), loadAssignments()]);

  // Nouvelles assignations du compte connecté (puis marquées comme vues)
  try{
    const r = await fetch('/api/assignments/me?mark_seen=true');
    const d = await r.json();
    if(d.unread > 0){
      const n = d.unread;
      document.getElementById('assign-banner-text').textContent =
        `${n} nouvelle${n>1?'s':''} offre${n>1?'s':''} vous ${n>1?'ont':'a'} été assignée${n>1?'s':''}.`;
      document.getElementById('assign-banner').style.display = 'flex';
    }
    VeilleAuth.refreshAssignBadge();
  }catch(e){ console.warn('Assignations :', e); }

  // Charger les AO pertinents
  let allNotices = [];
  try{
    const r = await fetch('/api/notices');
    const d = await r.json();
    allNotices = d.notices || [];
  }catch(e){
    document.getElementById('cards-container').innerHTML =
      `<div class="empty-page">Erreur : ${esc(String(e))}</div>`;
    return;
  }

  const notices = allNotices
    .filter(n => triageMap.get(n.id) === 'pertinent')
    .sort((a,b)=>{ const av=a.date_limite||'9999',bv=b.date_limite||'9999'; return av<bv?-1:av>bv?1:0; });

  document.getElementById('count-chip').textContent = notices.length;

  if(!notices.length){
    document.getElementById('cards-container').innerHTML = `
      <div class="empty-page">
        Aucune offre marquée comme pertinente.<br>
        Marquez des offres « Pertinent » depuis <a href="/analyse">Analyse AO</a>.
      </div>`;
    return;
  }

  document.getElementById('cards-container').innerHTML = notices.map(n => renderCard(n)).join('');

  const BATCH = 3;
  for(let i=0; i<notices.length; i+=BATCH){
    await Promise.allSettled(notices.slice(i,i+BATCH).map(n => fetchDetail(n.id)));
    if(i+BATCH < notices.length) await new Promise(r=>setTimeout(r,300));
  }
}

// Démarrage une fois la connexion vérifiée (compte validé).
VeilleAuth.onReady(init);
</script>
