/* ── Spécifique à la page Analyse AO ── */
.app-content > * { max-width: 1200px; }

/* Panneau de filtres latéral */
.drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(48,50,62,.45); z-index: 70; }
.drawer-overlay.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; height: 100vh; width: 320px; z-index: 80;

.drawer-body .filter-label { display: block; line-height: 1.4; margin: var(--sp-4) 0 var(--sp-2); }
.drawer-body .filter-label:first-child { margin-top: 0; }
.drawer-body .input, .drawer-body .date-input { width: 100%; }
.drawer-foot { display: flex; gap: var(--sp-2); padding: var(--sp-3) var(--sp-4); border-top: 1px dotted var(--ai-rouge); }
.drawer-foot .btn { flex: 1; }

  color: var(--ai-blanc); font-size: var(--fs-xs); font-weight: 700; display: inline-flex; align-items: center;
  justify-content: center; font-variant-numeric: tabular-nums; }

/* Fiches */
.ao-card-head .actions { flex-wrap: wrap; justify-content: flex-end; }
.ao-card-content { min-width: 0; }
.detail-text { font-size: var(--fs-md); line-height: 1.6; white-space: pre-wrap; max-height: 240px; overflow-y: auto; padding-right: var(--sp-1); }
.docs-list { display: flex; flex-direction: column; gap: 4px; }
.doc-link { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--ai-violet);
  text-decoration: none; word-break: break-all; }
.doc-link:hover { color: var(--ai-rouge); text-decoration: underline; }
.doc-link .icon { width: 14px; height: 14px; }
.detail-block + .detail-block { margin-top: var(--sp-3); }
.detail-cache { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: var(--fs-xs); color: var(--ai-noir70);
  margin-top: var(--sp-3); padding-top: var(--sp-2); border-top: 1px dotted var(--ai-trait); font-variant-numeric: tabular-nums; }
.link-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--ai-rouge); cursor: pointer; text-decoration: underline; }
.state-msg { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--ai-noir70); }
.state-msg.error { color: var(--ai-rouge); }
.spinner-dark { width: 14px; height: 14px; border: 2px solid var(--ai-gris); border-top-color: var(--ai-violet);
  border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }
.empty-page { text-align: center; padding: var(--sp-7) var(--sp-4); color: var(--ai-noir70); }
.empty-page a { color: var(--ai-rouge); font-weight: 600; }

/* Barre de tri fixe (mobile) */
.triage-bar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--ai-blanc);
  border-top: 1px dotted var(--ai-rouge); padding: var(--sp-2) var(--sp-3) var(--sp-3); flex-direction: column; gap: 6px; }
.triage-bar-context { font-size: var(--fs-xs); color: var(--ai-noir70); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.triage-bar .tri-switch { display: flex; }
.triage-bar .tri-switch button { flex: 1; justify-content: center; width: auto !important; height: 44px; }
.triage-bar .tri-switch .label { display: inline !important; }

@media (max-width: 768px) {

  #cards-container { padding-bottom: 100px; }
  .drawer { width: 100%; top: auto; bottom: 0; height: 85vh; border-left: 0; border-top: 1px dotted var(--ai-rouge);

  .drawer.open { transform: none; }
  .ao-card-head .tri-switch { display: none; }
}

<script>
'use strict';

// ── Tri commun à toute l'équipe (Supabase) ─────────────────────────────────
let triageMap = new Map();

async function loadTriage(){
  localStorage.removeItem('ao_veille_triage');   // ancien tri local, remplacé par le tri commun
  try{
    const r = await fetch('/api/triage');
    const d = await r.json();
    triageMap = new Map(Object.entries(d.triage || {}));
  }catch(e){ console.warn('Impossible de charger le triage :', e); }
}

async function setTriage(id, val){
  const current = triageMap.get(id) || null;
  const newState = (current === val) ? null : val; // toggle off → non trié
  if(newState) triageMap.set(id, newState);
  else triageMap.delete(id);

  // Non pertinent ou pertinent → retirer la carte immédiatement
  if(newState === 'non-pertinent' || newState === 'pertinent'){
    const card = document.getElementById(`card-${CSS.escape(id)}`);
    if(card){
      card.style.transition = 'opacity .2s ease, max-height .3s ease, margin .3s ease';
      card.style.overflow = 'hidden';
      card.style.opacity = '0';
      card.style.maxHeight = card.offsetHeight + 'px';
      requestAnimationFrame(()=>{ card.style.maxHeight = '0'; card.style.marginBottom = '0'; });
      setTimeout(()=>{
        card.remove();
        // Mettre à jour le compteur
        const remaining = document.querySelectorAll('.ao-card').length;
        const chip = document.getElementById('count-chip');
        if(chip) chip.textContent = remaining;
      }, 320);
    }
  } else {
    applyTriageClass(id, triageMap.get(id)||null);
    updateTriageBtns(id, triageMap.get(id)||null);
  }

  // Synchronisation serveur
  try{
    const r = await fetch(`/api/triage/${encodeURIComponent(id)}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({state: newState})
    });
    if(!r.ok) throw new Error((await r.json()).error || ('HTTP ' + r.status));
  }catch(e){
    console.warn('Tri non enregistré :', e);
    alert('Tri non enregistré : ' + e.message + '\nLa page va être rechargée.');
    location.reload();
  }
}

function applyTriageClass(id, state){
  const card = document.getElementById(`card-${CSS.escape(id)}`);
  if(!card) return;
  card.classList.remove('triage-pertinent','triage-pre-tri','triage-non-pertinent');
  if(state) card.classList.add(`triage-${state}`);
}
function updateTriageBtns(id, state){
  const btns = document.querySelectorAll(`[data-triage-id="${CSS.escape(id)}"]`);
  btns.forEach(btn=>{
    btn.setAttribute('aria-pressed', String(btn.dataset.triageVal === state));
  });
}

// ── Helpers ────────────────────────────────────────────────────────────────
const MONTHS=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function fmtDate(iso){
  if(!iso) return '—';
  const p=iso.split('-');
  if(p.length<3) return iso;
  return `${parseInt(p[2])} ${MONTHS[parseInt(p[1])-1]||'?'} ${p[0]}`;
}
function bailleurShort(b){
  return {'Banque Mondiale':'BM','Expertise France':'EF','TED':'UE'}[b] || b;
}
function gauge(p){
  const lvl = p==='Haute' ? 3 : (p==='Moyenne' ? 2 : 1);
  return `<span class="gauge" data-level="${lvl}"><i></i><i></i><i></i></span>`;
}
const ICON = name => `<svg class="icon"><use href="#i-${name}"/></svg>`;
function isUrgent(iso){
  if(!iso) return false;
  const diff=(new Date(iso)-new Date())/(1000*60*60*24);
  return diff>=0&&diff<=7;
}

// ── Render card shell ──────────────────────────────────────────────────────
function renderCardShell(n, triage){
  const state = triage.get(n.id)||null;
  const trClass = state ? ` triage-${state}` : '';
  const id = esc(n.id);

  // Fiche signalétique (colonne de gauche)
  const spec = [
    ['Pays', esc(n.pays)],
    ['Limite', n.date_limite ? `<span class="deadline${isUrgent(n.date_limite)?' urgent':''}">${fmtDate(n.date_limite)}</span>` : ''],
    ['Publication', n.date_publication ? fmtDate(n.date_publication) : ''],
    ['Type', esc(n.type_avis)],
    ['Mode', esc(n.mode_selection)],
    ['Langue', esc(n.langue)],
    ['Secteur', n.secteur && n.secteur !== 'Autre' ? esc(n.secteur) : ''],
    ['Pertinence', `${gauge(n.pertinence)} ${esc(n.pertinence||'À vérifier')}`],
  ].filter(([,v]) => v).map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');

  const btn = (val, cls, icon, label) =>
    `<button class="${cls}" type="button" data-triage-id="${id}" data-triage-val="${val}"
       aria-pressed="${state===val}" aria-label="${label}" title="${label}"
       onclick="setTriage('${id}','${val}')">${ICON(icon)}<span class="label">${label}</span></button>`;

  return `
<article class="ao-card${trClass}" id="card-${id}"
     data-id="${id}"
     data-bailleur="${esc(n.bailleur||'')}"
     data-pertinence="${esc(n.pertinence||'')}"
     data-deadline="${esc(n.date_limite||'')}"
     data-search="${esc((n.titre||'')+' '+(n.projet||'')+' '+(n.pays||'')).toLowerCase()}">
  <div class="ao-card-head">
    <span class="badge" title="${esc(n.bailleur)}">${esc(bailleurShort(n.bailleur))}</span>
    <div class="title"><span class="card-title">${esc(n.titre)}</span>
      ${n.projet && n.projet !== n.titre ? `<small>${esc(n.projet)}</small>` : ''}</div>
    <div class="actions">
      <div class="tri-switch" role="group" aria-label="Tri de l'AO">
        ${btn('non-pertinent','tri-np','np','Non pertinent')}
        ${btn('pre-tri','tri-pre','pre','Pré-tri')}
        ${btn('pertinent','tri-pert','star','Pertinent')}
      </div>
      ${n.lien ? `<a href="${esc(n.lien)}" target="_blank" rel="noopener" class="btn btn-outline btn-sm">${ICON('ext')}Voir l'avis</a>` : ''}
    </div>
  </div>
  <div class="ao-card-body">
    <aside class="spec"><dl>${spec}</dl></aside>
    <div class="ao-card-content" id="body-${id}">
      <div class="state-msg"><div class="spinner-dark"></div>Chargement…</div>
    </div>
  </div>
  <div class="ao-card-foot" id="criteria-${id}" style="display:none"></div>
</article>`;
}

// ── Render enriched detail ─────────────────────────────────────────────────
function renderDetail(noticeId, d, bailleur){
  const body = document.getElementById(`body-${noticeId}`);
  if(!body) return;

  // Cas : fetch précédemment échoué, mis en cache comme indisponible
  if(d._failed){
    body.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'state-msg error';
    const ico = document.createTextNode('Source inaccessible · ');
    const btn = document.createElement('button');
    btn.className = 'link-btn';
    btn.type = 'button';
    btn.textContent = 'Réessayer';
    btn.addEventListener('click', () => fetchDetail(noticeId, true));
    wrap.appendChild(ico);
    wrap.appendChild(btn);
    if(d._fetched_at){
      const ts = document.createElement('span');
      ts.className = 'muted num';
      ts.textContent = ` (dernier essai : ${d._fetched_at.slice(0,16).replace('T',' ')})`;
      wrap.appendChild(ts);
    }
    body.appendChild(wrap);
    return;
  }

  const parts = [];

  // ── Description / Mission ────────────────────────────────────────────
  const descText = d.description || d.description_section || d.full_text || '';
  if(descText){
    parts.push(`<div class="detail-block"><div class="section-label">Mission</div><div class="detail-text">${esc(descText)}</div></div>`);
  }

  // ── Documents ────────────────────────────────────────────────────────
  if(d.documents && d.documents.length){
    const docLinks = d.documents.map(doc=>
      `<a href="${esc(doc.url)}" target="_blank" rel="noopener" class="doc-link">${ICON('doc')}${esc(doc.name)}</a>`
    ).join('');
    parts.push(`<div class="detail-block"><div class="section-label">Documents</div><div class="docs-list">${docLinks}</div></div>`);
  }

  // ── Note bailleur (GIZ, etc.) ────────────────────────────────────────
  if(d.note){
    parts.push(`<div class="detail-block note note-context">${esc(d.note)}</div>`);
  }

  if(!parts.length){
    body.innerHTML = `<div class="state-msg">Aucune donnée supplémentaire disponible depuis ce bailleur.</div>`;
  } else {
    body.innerHTML = parts.join('');
  }

  // ── Critères de sélection (pleine largeur, en bas) ───────────────────
  const crit = document.getElementById(`criteria-${noticeId}`);
  if(crit && d.criteria_section){
    crit.innerHTML = `<div class="section-label">Critères de sélection</div><div class="detail-text">${esc(d.criteria_section)}</div>`;
    crit.style.display = '';
  }

  // ── Badge cache ───────────────────────────────────────────────────────
  if(d._cached && body){
    const ts = d._fetched_at ? d._fetched_at.slice(0,16).replace('T',' ') : '';
    const badge = document.createElement('div');
    badge.className = 'detail-cache';
    badge.textContent = `En cache${ts ? ' · ' + ts : ''}`;
    const sep = document.createTextNode(' · ');
    const btn = document.createElement('button');
    btn.className = 'link-btn';
    btn.type = 'button';
    btn.textContent = 'Actualiser';
    btn.addEventListener('click', () => fetchDetail(noticeId, true));
    badge.appendChild(sep);
    badge.appendChild(btn);
    body.appendChild(badge);
  }
}

// ── Fetch detail async ────────────────────────────────────────────────────
async function fetchDetail(noticeId, force=false){
  const body = document.getElementById(`body-${noticeId}`);
  if(force && body){
    body.innerHTML = `<div class="state-msg"><div class="spinner-dark"></div>Mise à jour…</div>`;
    const crit = document.getElementById(`criteria-${noticeId}`);
    if(crit){ crit.innerHTML=''; crit.style.display='none'; }
  }
  try{
    const url = `/api/ao-detail/${encodeURIComponent(noticeId)}${force?'?force=true':''}`;
    const r = await fetch(url);
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    if(d.error){
      if(body) body.innerHTML = `<div class="state-msg error">${esc(d.error)}</div>`;
      return;
    }
    renderDetail(noticeId, d, d.bailleur);
  }catch(e){
    if(body) body.innerHTML = `<div class="state-msg error">Erreur : ${esc(String(e))}</div>`;
  }
}

// ── Mobile navigation ─────────────────────────────────────────────────────
function toggleSidebar(){ document.body.classList.toggle('sidebar-open') }

// ── Filter drawer ──────────────────────────────────────────────────────────
function toggleFilterDrawer(){
  document.getElementById('filter-drawer').classList.toggle('open');
  document.getElementById('filter-toggle-btn').setAttribute('aria-expanded', String(document.getElementById('filter-drawer').classList.contains('open')));
  document.getElementById('filter-drawer-overlay').classList.toggle('open');
}
function closeFilterDrawer(){
  document.getElementById('filter-drawer').classList.remove('open');
  document.getElementById('filter-drawer-overlay').classList.remove('open');
}

function applyCardFilters(){
  const bailleurs  = [...document.querySelectorAll('.fd-bailleur:checked')].map(c=>c.value);
  const pertinences= [...document.querySelectorAll('.fd-pertinence:checked')].map(c=>c.value);
  // Valeurs proposées : une case décochée exclut ses cartes, même si toute la
  // section est décochée ; une valeur sans case (cas imprévu) ne filtre pas.
  const offeredB = new Set([...document.querySelectorAll('.fd-bailleur')].map(c=>c.value));
  const offeredP = new Set([...document.querySelectorAll('.fd-pertinence')].map(c=>c.value));
  const deadlineFrom = document.getElementById('fd-deadline-from')?.value || '';
  const search     = (document.getElementById('fd-search')?.value || '').trim().toLowerCase();

  let visible = 0;
  document.querySelectorAll('.ao-card').forEach(card => {
    const b = card.dataset.bailleur || '';
    const p = card.dataset.pertinence || '';
    const d = card.dataset.deadline || '';
    const s = card.dataset.search || '';

    const okB = !offeredB.has(b) || bailleurs.includes(b);
    const okP = !offeredP.has(p) || pertinences.includes(p);
    const okD = !deadlineFrom      || d >= deadlineFrom;
    const okS = !search            || s.includes(search);

    const show = okB && okP && okD && okS;
    card.style.display = show ? '' : 'none';
    if(show) visible++;
  });

  const chip = document.getElementById('count-chip');
  if(chip) chip.textContent = visible;
  updateFilterBadge();
}

function updateFilterBadge(){
  const bailleurs  = [...document.querySelectorAll('.fd-bailleur:checked')].length;
  const totalB     = document.querySelectorAll('.fd-bailleur').length;
  const pertinences= [...document.querySelectorAll('.fd-pertinence:checked')].length;
  const totalP     = document.querySelectorAll('.fd-pertinence').length;
  const hasDeadline= !!document.getElementById('fd-deadline-from')?.value;
  const hasSearch  = !!(document.getElementById('fd-search')?.value || '').trim();

  let active = 0;
  if(bailleurs < totalB)   active++;
  if(pertinences < totalP) active++;
  if(hasDeadline)          active++;
  if(hasSearch)            active++;

  const badge = document.getElementById('active-filter-badge');
  if(badge){
    badge.textContent = active;
    badge.style.display = active > 0 ? '' : 'none';
  }
}

function resetCardFilters(){
  document.querySelectorAll('.fd-bailleur, .fd-pertinence').forEach(c => c.checked = true);
  const dd = document.getElementById('fd-deadline-from'); if(dd) dd.value = '';
  const sr = document.getElementById('fd-search');        if(sr) sr.value = '';
  applyCardFilters();
}

// Listen to filter changes for live update (without closing drawer)
document.addEventListener('DOMContentLoaded', ()=>{
  document.querySelectorAll('.fd-bailleur, .fd-pertinence').forEach(c =>
    c.addEventListener('change', applyCardFilters)
  );
  const dd = document.getElementById('fd-deadline-from');
  const sr = document.getElementById('fd-search');
  if(dd) dd.addEventListener('input', applyCardFilters);
  if(sr) sr.addEventListener('input', applyCardFilters);
});

// ── Triage bar (IntersectionObserver) ─────────────────────────────────────
let _focusedCardId = null;
let _triageObserver = null;

function setupTriageBar(){
  const cards = document.querySelectorAll('.ao-card');
  if(!cards.length) return;

  _triageObserver = new IntersectionObserver(entries => {
    let best = null, bestRatio = -1;
    entries.forEach(e => {
      if(e.intersectionRatio > bestRatio){
        bestRatio = e.intersectionRatio;
        best = e.target;
      }
    });
    if(best && bestRatio > 0.05){
      _focusedCardId = best.dataset.id;
      const title = best.querySelector('.card-title')?.textContent || '';
      const el = document.getElementById('triage-bar-title');
      if(el) el.textContent = title.length > 55 ? title.slice(0,55)+'…' : title;
      updateTriageBarState();
    }
  }, { threshold:[0.05, 0.25, 0.5, 0.75, 1.0] });

  cards.forEach(card => _triageObserver.observe(card));
}

function updateTriageBarState(){
  if(!_focusedCardId) return;
  const state = triageMap.get(_focusedCardId) || null;
  document.querySelectorAll('.triage-bar-btn').forEach(btn => {
    btn.setAttribute('aria-pressed', String(btn.dataset.val === state));
  });
}

function triageBarAction(val){
  if(!_focusedCardId) return;
  setTriage(_focusedCardId, val);
  // Refresh bar state after a short delay (setTriage may remove the card)
  setTimeout(updateTriageBarState, 50);
}

// L'identité (compte connecté) et le badge d'assignations sont gérés par
// /static/auth.js (VeilleAuth.user, VeilleAuth.refreshAssignBadge).

// ── Main ──────────────────────────────────────────────────────────────────
async function init(){
  await loadTriage();
  const triage = triageMap;

  // Filtrer les IDs pré-tri
  const pretriIds = new Set(
    [...triage.entries()].filter(([,v])=>v==='pre-tri').map(([k])=>k)
  );

  if(pretriIds.size === 0){
    document.getElementById('count-chip').textContent = '0';
    document.getElementById('cards-container').innerHTML = `
      <div class="empty-page">
        Aucun AO en pré-tri pour le moment.<br>
        Retournez sur la <a href="/">page Veille</a> et cliquez sur « Pré-tri » pour marquer des AO à analyser.
      </div>`;
    return;
  }

  // Charger tous les AO depuis l'API
  let allNotices = [];
  try{
    const r = await fetch('/api/notices');
    const d = await r.json();
    allNotices = d.notices || [];
  }catch(e){
    document.getElementById('cards-container').innerHTML =
      `<div class="empty-page">Erreur de chargement : ${esc(String(e))}</div>`;
    return;
  }

  // Garder uniquement les pré-tri
  const notices = allNotices.filter(n => pretriIds.has(n.id));

  // Trier par deadline croissante
  notices.sort((a,b)=>{
    const av=a.date_limite||'9999', bv=b.date_limite||'9999';
    return av<bv?-1:av>bv?1:0;
  });

  document.getElementById('count-chip').textContent = notices.length;

  if(!notices.length){
    document.getElementById('cards-container').innerHTML = `
      <div class="empty-page">
        Les AO en pré-tri ne sont plus actifs ou n'ont pas encore été collectés.<br>
        <a href="/">Retour à la veille</a>
      </div>`;
    return;
  }

  // Rendre les shells de cartes
  document.getElementById('cards-container').innerHTML =
    notices.map(n => renderCardShell(n, triage)).join('');

  // Charger les détails en parallèle (par lots de 3 pour ne pas surcharger)
  const BATCH = 3;
  for(let i=0; i<notices.length; i+=BATCH){
    const batch = notices.slice(i, i+BATCH);
    await Promise.allSettled(batch.map(n => fetchDetail(n.id)));
    if(i+BATCH < notices.length) await new Promise(r=>setTimeout(r,300));
  }

  // Triage bar — observe les cartes après rendu complet
  setupTriageBar();
}

// Démarrage une fois la connexion vérifiée (compte validé).
VeilleAuth.onReady(init);
</script>
